version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bhoomichain-db
    environment:
      POSTGRES_USER: ${DB_USER:-bhoomi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bhoomi123}
      POSTGRES_DB: ${DB_NAME:-bhoomichain}
    ports:
      - "5432:5432"
    volumes:
      - bhoomi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bhoomi} -d ${DB_NAME:-bhoomichain}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bhoomi_pgdata:
